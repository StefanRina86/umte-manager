<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>UMTE Manager · Imposta password</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;padding:18px;background:#eff5f7;color:#12384e}main{max-width:460px;margin:10vh auto;background:white;padding:28px;border:1px solid #d9e5e9;border-radius:18px}label{display:block;margin:20px 0 6px;font-weight:650}input,button{font:inherit;width:100%;padding:12px;min-height:48px;border-radius:8px}input{border:1px solid #b7cbd3}button{margin-top:18px;border:0;background:#10384e;color:white;font-weight:bold}#status{line-height:1.5}a{color:#156381}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><script src="config.js?v=security-20261105" defer></script></head><body><main><h1>Imposta la tua password</h1><p>Accesso personale UMTE Manager. Scegli una password nuova, non utilizzata su altri servizi.</p><form id="form" hidden><label for="password">Nuova password (almeno 12 caratteri)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Ripeti password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="submit">Imposta password</button></form><p id="status" role="status" aria-live="polite">Verifica dell’invito…</p><a href="./">Torna a UMTE Manager</a></main><script>(async()=>{'use strict';const $=id=>document.getElementById(id);const c=window.UMTE_CLOUD_CONFIG;if(!c||!window.supabase?.createClient){$('status').textContent='Servizio non disponibile.';return;}const api=window.supabase.createClient(c.url,c.key,{auth:{storageKey:'umte-manager-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{const {data,error}=await api.auth.getSession();if(error||!data.session)throw Error('Invito scaduto o non valido. Richiedi un nuovo invito al responsabile.');$('form').hidden=false;$('status').textContent='Invito verificato. Puoi impostare la password.';}catch(e){$('status').textContent=e.message;return;} $('form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit'),password=$('password').value; if(password!==$('confirm').value){$('status').textContent='Le due password non coincidono.';return;}btn.disabled=true;try{const {error}=await api.auth.updateUser({password});if(error)throw error;$('form').hidden=true;$('status').textContent='Password impostata. Ora il responsabile dovrà abilitare il tuo profilo; poi potrai accedere alla pagina principale.';}catch(err){$('status').textContent='Non è stato possibile aggiornare la password: '+(err.message||err);}finally{btn.disabled=false;}});})();</script></body></html>
