name: UMTE - verifica layout mobile e desktop
on:
  push:
    branches: [main]
    paths:
      - 'mobile-shift-cards.js'
      - 'mobile-shift-cards.css'
      - 'mobile-polish.css'
      - 'tests/**'
      - 'accessi-colleghi.html'
      - 'imposta-password.html'
      - 'accesso-guidato.js'
      - 'accesso-guidato.css'
      - 'guida-rapida.js'
      - 'guida-rapida.css'
      - 'interfaccia-2026.css'
      - '.github/workflows/umte-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check Playwright and Chromium installation
        run: |
          node --version
          npm --version
          npx playwright --version
          npx playwright install --dry-run chromium
      - name: Test synthetic schedules at 375, 390, 430, 768 and 1440px
        id: layout
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=spec tests/mobile-layout.test.cjs 2>&1 | tee "${RUNNER_TEMP}/umte-layout-test-log.txt"
      - name: Test invitations and first-password onboarding
        if: always()
        id: onboarding
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=spec tests/onboarding-layout.test.cjs 2>&1 | tee "${RUNNER_TEMP}/umte-onboarding-test-log.txt"
      - name: Test novice onboarding and six role guides on phone and desktop
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=spec tests/usability-layout.test.cjs 2>&1 | tee "${RUNNER_TEMP}/umte-usability-test-log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umte-visual-qa-synthetic
          path: |
            ${{ runner.temp }}/umte-*.png
            ${{ runner.temp }}/umte-*-test-log.txt
          retention-days: 7
